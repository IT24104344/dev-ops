name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-scans:
    name: Security Automation Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. SAST - Semgrep Code Scan
      - name: Run Semgrep (SAST)
        run: npx semgrep --config=auto

      # 2. SCA - npm audit Dependency Scan
      - name: Run npm audit (SCA)
        run: npm audit --audit-level=high
        continue-on-error: true

      # 3. Secret Scanning - Gitleaks
      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 4. Container Scanning - Trivy (HARD GATE)
      - name: Run Trivy Container Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nodegoat-web:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
